[project]
name = "task-agent"
version = "0.1.0"
description = "Add and manage items in a GitHub Project (v2)"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "flask>=3.0",
    "urllib3<2",  # macOS system Python uses LibreSSL, which urllib3 v2 warns about
]

[project.scripts]
task-agent = "task_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["task_agent"]

[tool.setuptools.package-data]
task_agent = ["static/*"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads the real GitHub project from .env (read-only)"]
